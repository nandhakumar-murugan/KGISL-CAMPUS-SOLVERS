<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Notice Copilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h3>🏛️ Campus Notice Copilot</h3>
    <span class="badge">KiTE Edition</span>
  </div>
  <div class="content">
    <div class="status-box">
      <div class="status-indicator">🟢 Active & Monitoring</div>
      <small>WhatsApp Web Tab Connected</small>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-num" id="total-notices">0</span>
        <span class="stat-label">Notices</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="exam-notices">0</span>
        <span class="stat-label">Exams / CIA</span>
      </div>
    </div>
    <div class="actions">
      <a href="https://web.whatsapp.com" target="_blank" class="btn primary">Open WhatsApp Web</a>
    </div>
  </div>
  <div class="footer">
    <span>By Nandhakumar M (GSA)</span>
    <a href="https://github.com/nandhakumar-murugan/KGISL-CAMPUS-SOLVERS" target="_blank">KGISL Solvers</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
